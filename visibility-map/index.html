<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Visibility Map</title>
<meta name="description" content="A private, local-only tool for deciding which parts of your identity to make visible, and to whom.">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Instrument+Serif:ital@0;1&display=swap">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<!-- Shared SVG definitions: paper grain for folders -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <defs>
    <filter id="paper" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency="0.95" numOctaves="2" seed="7" result="noise"/>
      <feColorMatrix in="noise" type="saturate" values="0" result="grey"/>
      <feComponentTransfer in="grey" result="grain"><feFuncA type="table" tableValues="0 0.22"/></feComponentTransfer>
      <feComposite in="grain" in2="SourceGraphic" operator="in" result="tex"/>
      <feMerge><feMergeNode in="SourceGraphic"/><feMergeNode in="tex"/></feMerge>
    </filter>
  </defs>
</svg>

<a class="skip-link" href="#view">Skip to content</a>

<div class="shell">
  <div class="window" id="window">
    <aside class="sidebar" id="sidebar" aria-label="Sections"></aside>

    <div class="main">
      <header class="toolbar" id="toolbar"></header>
      <main id="view" class="view" tabindex="-1"></main>
      <nav class="stepnav" id="stepnav" aria-label="Step navigation"></nav>
    </div>
  </div>

  <footer class="site-foot" id="site-foot"></footer>
</div>

<dialog id="menu-dialog" class="sheet" aria-label="Sections and data"></dialog>
<dialog id="data-dialog" class="sheet sheet-data" aria-labelledby="data-dialog-title"></dialog>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="script.js"></script>
</body>
</html>
